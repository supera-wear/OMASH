name: CIE Shield 0.8.4 Known-Good Install Path

on:
  push:
    branches: [cie07-branding-077]
    paths:
      - 'cie071stable/**'
      - '.github/workflows/cie07-stable-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate unified banner polish
        run: python3 cie071stable/apply_ui_polish.py

      - name: Prepare 0.8.4 UI and original icon
        run: python3 cie071stable/apply_v080.py

      - name: Verify source contract
        run: |
          MANIFEST=cie071stable/app/src/main/AndroidManifest.xml
          DEBUG_MANIFEST=cie071stable/app/src/debug/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$MANIFEST"
          grep -q 'android.permission.RECEIVE_SMS' "$MANIFEST"
          grep -q 'android.permission.SEND_SMS' "$MANIFEST"
          grep -q 'android.permission.RECEIVE_MMS' "$MANIFEST"
          grep -q 'android.permission.RECEIVE_WAP_PUSH' "$MANIFEST"
          grep -q 'android.permission.WRITE_SMS' "$MANIFEST"
          grep -q 'android.provider.Telephony.SMS_DELIVER' "$MANIFEST"
          grep -q 'android.provider.Telephony.WAP_PUSH_DELIVER' "$MANIFEST"
          grep -q 'android.intent.action.RESPOND_VIA_MESSAGE' "$MANIFEST"
          grep -q 'android.intent.action.SENDTO' "$MANIFEST"
          grep -q 'android.telecom.CallScreeningService' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android:usesCleartextTraffic="false"' "$MANIFEST"
          grep -q 'cie_shield_app_icon_original' "$MANIFEST"
          grep -q 'android.permission.READ_CONTACTS' "$DEBUG_MANIFEST"
          ! grep -q 'READ_SMS' "$MANIFEST"
          ! grep -q 'READ_CALL_LOG' "$MANIFEST"
          grep -q 'applicationId = "com.cie.app.stable084fresh"' cie071stable/app/build.gradle.kts
          grep -q 'versionCode = 22' cie071stable/app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' cie071stable/app/build.gradle.kts
          ! grep -q 'signingConfigs' cie071stable/app/build.gradle.kts

      - name: Verify trust localization and coverage sources
        run: |
          grep -q 'object CieTrustEngine' cie071stable/app/src/main/java/com/cie/app/CieTrustEngine.kt
          grep -q 'object CieCommercialCallEngine' cie071stable/app/src/main/java/com/cie/app/CieCommercialCallEngine.kt
          grep -q 'CieCommercialCallEngine.evaluate' cie071stable/app/src/main/java/com/cie/app/telecom/CieCallScreeningService.kt
          grep -q 'class CieSmsDeliverReceiver' cie071stable/app/src/main/java/com/cie/app/MessageShieldLive.kt
          grep -q 'fun CieContactCoverageCard' cie071stable/app/src/main/java/com/cie/app/CieContactCoverage.kt
          grep -q 'CieLanguage.ARABIC' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt
          grep -q 'CieLanguage.PORTUGUESE' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt
          grep -q 'CieLanguage.GERMAN' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt
          grep -q 'CieLanguage.TURKISH' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt
          grep -q 'CieLanguage.DUTCH' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt
          grep -q 'CieLanguage.ENGLISH' cie071stable/app/src/main/java/com/cie/app/CieLocalization.kt

      - name: Build APK using known-good debug signing path
        working-directory: cie071stable
        run: gradle :app:assembleDebug --stacktrace -PCIE_API_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieapi.compute.c-5.eu-central-1.aws.neon.tech -PCIE_IDENTITY_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieidentity.compute.c-5.eu-central-1.aws.neon.tech

      - name: Verify APK without modifying it after build
        run: |
          APK=cie071stable/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
          BADGING="$($AAPT2 dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.cie.app.stable084fresh' versionCode='22' versionName='0.8.4'"
          echo "$BADGING" | grep -q "application-label:'CIE Shield'"
          test "$(echo "$BADGING" | grep -c '^launchable-activity:')" -eq 1
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          PERMS="$($AAPT2 dump permissions "$APK")"
          echo "$PERMS" | grep -q 'android.permission.RECEIVE_SMS'
          echo "$PERMS" | grep -q 'android.permission.SEND_SMS'
          echo "$PERMS" | grep -q 'android.permission.RECEIVE_MMS'
          echo "$PERMS" | grep -q 'android.permission.RECEIVE_WAP_PUSH'
          echo "$PERMS" | grep -q 'android.permission.READ_CONTACTS'
          ! echo "$PERMS" | grep -E 'READ_SMS|READ_CALL_LOG'
          ICON_HASH="$(unzip -p "$APK" res/drawable/cie_shield_app_icon_original.webp | sha256sum | awk '{print $1}')"
          test "$ICON_HASH" = 'f9618336d47cc6b2a62a210e956c5c569f76571f1ee077ce4280b0f2a2644897'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIE-Shield-0.8.4-Known-Good-Install-Path-APK
          path: cie071stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
