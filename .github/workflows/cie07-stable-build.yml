name: CIE Shield 0.8.5 Install Safe V2

on:
  push:
    branches: [cie085-install-safe-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare install-safe build
        run: |
          sed -i 's/applicationId = "com.cie.app.stable079"/applicationId = "com.cie.app.stable085v2"/' cie071stable/app/build.gradle.kts
          sed -i 's/versionCode = 19/versionCode = 23/' cie071stable/app/build.gradle.kts
          sed -i 's/versionName = "0.8.1"/versionName = "0.8.5"/' cie071stable/app/build.gradle.kts
          sed -i 's/CIE Shield 0.8.1/CIE Shield 0.8.5/g' cie071stable/app/src/main/java/com/cie/app/SecondaryScreens076.kt
          git show origin/cie07-branding-077:cie071stable/cie-app-icon-original.webp.b64 | tr -d '\n' | base64 --decode > cie071stable/app/src/main/res/drawable/cie_shield_app_icon_original.webp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cie071stable/app/src/main/java/com/cie/app/SecondaryScreens076.kt')
          s=p.read_text()
          if 'CieContactCoverageCard()' not in s:
              marker='''            item {\n                Cie076Card {\n                    Text(cieText("sync"), fontSize = 20.sp, fontWeight = FontWeight.Bold)'''
              s=s.replace(marker, '''            item { CieContactCoverageCard() }\n            item {\n                Cie076Card {\n                    Text(cieText("sync"), fontSize = 20.sp, fontWeight = FontWeight.Bold)''', 1)
          p.write_text(s)
          PY
      - name: Build APK
        working-directory: cie071stable
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=cie071stable/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK" >/dev/null
          "$AAPT2" dump badging "$APK" | grep -q "package: name='com.cie.app.stable085v2' versionCode='23' versionName='0.8.5'"
          VERIFY="$($APKSIGNER verify --verbose --print-certs "$APK")"
          echo "$VERIFY"
          echo "$VERIFY" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          ! "$AAPT2" dump permissions "$APK" | grep -E 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|WRITE_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH'
          "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.READ_CONTACTS'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: CIE-Shield-0.8.5-INSTALL-SAFE-V2-APK
          path: cie071stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
