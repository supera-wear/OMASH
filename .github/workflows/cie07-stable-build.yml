name: CIE Shield 0.8.4 Install Safe

on:
  push:
    branches: [cie084-install-safe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare install-safe 0.8.4 from proven 0.8.1 baseline
        run: |
          sed -i 's/applicationId = "com.cie.app.stable079"/applicationId = "com.cie.app.stable084safe"/' cie071stable/app/build.gradle.kts
          sed -i 's/versionCode = 19/versionCode = 22/' cie071stable/app/build.gradle.kts
          sed -i 's/versionName = "0.8.1"/versionName = "0.8.4"/' cie071stable/app/build.gradle.kts
          sed -i 's/CIE Shield 0.8.1/CIE Shield 0.8.4/g' cie071stable/app/src/main/java/com/cie/app/SecondaryScreens076.kt
          git show origin/cie07-branding-077:cie071stable/cie-app-icon-original.webp.b64 | tr -d '\n' | base64 --decode > cie071stable/app/src/main/res/drawable/cie_shield_app_icon_original.webp

      - name: Verify safe manifest and app metadata
        run: |
          MANIFEST=cie071stable/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST"
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' "$MANIFEST"
          grep -q 'android.telecom.CallScreeningService' "$MANIFEST"
          grep -q 'cie_shield_app_icon_original' "$MANIFEST"
          ! grep -Eq 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|READ_CONTACTS|WRITE_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH' "$MANIFEST"
          grep -q 'applicationId = "com.cie.app.stable084safe"' cie071stable/app/build.gradle.kts
          grep -q 'versionCode = 22' cie071stable/app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' cie071stable/app/build.gradle.kts

      - name: Build APK
        working-directory: cie071stable
        run: gradle :app:assembleDebug --stacktrace -PCIE_API_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieapi.compute.c-5.eu-central-1.aws.neon.tech -PCIE_IDENTITY_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieidentity.compute.c-5.eu-central-1.aws.neon.tech

      - name: Verify final APK
        run: |
          APK=cie071stable/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ZIPALIGN" -c -P 16 -v 4 "$APK" >/dev/null
          BADGING="$($AAPT2 dump badging "$APK")"
          echo "$BADGING" | grep -q "package: name='com.cie.app.stable084safe' versionCode='22' versionName='0.8.4'"
          echo "$BADGING" | grep -q "application-label:'CIE Shield'"
          test "$(echo "$BADGING" | grep -c '^launchable-activity:')" -eq 1
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ! "$AAPT2" dump permissions "$APK" | grep -E 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CALL_LOG|READ_CONTACTS|WRITE_SMS|RECEIVE_MMS|RECEIVE_WAP_PUSH'
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIE-Shield-0.8.4-INSTALL-SAFE-APK
          path: cie071stable/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
