name: CIE 0.9.3 Full Temporary Android Build

on:
  push:
    branches: [cie-build-temp-093-full]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build CIE 0.9.3 Full APK
        working-directory: cie092
        run: gradle :app:assembleDebug --stacktrace -PCIE_API_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieapi.compute.c-5.eu-central-1.aws.neon.tech -PCIE_MESSAGE_API_BASE_URL=https://br-sparkling-dream-b1q8x3n5-cieapi.compute.c-5.eu-central-1.aws.neon.tech

      - name: Verify APK package
        run: |
          APK=cie092/app/build/outputs/apk/debug/app-debug.apk
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$AAPT2" dump badging "$APK" | grep -q "package: name='com.cie.app' versionCode='13' versionName='0.9.3'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIE-0.9.3-Full-Beta-APK
          path: cie092/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
