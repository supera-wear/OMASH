name: CIE 0.9.2 Temporary Android Build

on:
  push:
    branches: [cie-build-temp-092]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build CIE 0.9.2 APK
        working-directory: cie092
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package
        run: |
          APK=cie092/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIE-0.9.2-Installable-APK
          path: cie092/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
